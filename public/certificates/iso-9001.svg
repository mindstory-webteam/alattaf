<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f4efe6"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c59b27"/>
      <stop offset="30%" stop-color="#f3e5ab"/>
      <stop offset="60%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#1b4974"/>
    </linearGradient>
    <radialGradient id="goldSeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe885"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="636" fill="url(#bgGrad)"/>
  
  <!-- Subtle guilloche / security line background -->
  <g opacity="0.04" stroke="#0f2b48" stroke-width="1" fill="none">
    <circle cx="450" cy="318" r="120"/>
    <circle cx="450" cy="318" r="180"/>
    <circle cx="450" cy="318" r="240"/>
    <circle cx="450" cy="318" r="300"/>
    <path d="M50 50 L850 586 M50 586 L850 50"/>
  </g>

  <!-- Outer Borders -->
  <rect x="24" y="24" width="852" height="588" fill="none" stroke="url(#goldBorder)" stroke-width="6"/>
  <rect x="36" y="36" width="828" height="564" fill="none" stroke="#0f2b48" stroke-width="2"/>
  <rect x="42" y="42" width="816" height="552" fill="none" stroke="url(#goldBorder)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Corner Ornaments -->
  <g fill="url(#goldBorder)">
    <!-- Top Left -->
    <path d="M24 24 L60 24 L60 30 L30 30 L30 60 L24 60 Z"/>
    <circle cx="42" cy="42" r="4"/>
    <!-- Top Right -->
    <path d="M876 24 L840 24 L840 30 L870 30 L870 60 L876 60 Z"/>
    <circle cx="858" cy="42" r="4"/>
    <!-- Bottom Left -->
    <path d="M24 612 L60 612 L60 606 L30 606 L30 576 L24 576 Z"/>
    <circle cx="42" cy="594" r="4"/>
    <!-- Bottom Right -->
    <path d="M876 612 L840 612 L840 606 L870 606 L870 576 L876 576 Z"/>
    <circle cx="858" cy="594" r="4"/>
  </g>

  <!-- Top Certification Emblem -->
  <g transform="translate(450, 95)" text-anchor="middle">
    <!-- Star/Crown icon -->
    <circle cx="0" cy="0" r="26" fill="#0f2b48"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#goldBorder)" stroke-width="2"/>
    <path d="M-10 6 L0 -14 L10 6 L-14 -4 L14 -4 Z" fill="url(#goldBorder)"/>
  </g>

  <!-- Header -->
  <text x="450" y="150" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="28" font-weight="bold" fill="#0f2b48" letter-spacing="4" text-anchor="middle">
    CERTIFICATE OF REGISTRATION
  </text>
  <text x="450" y="174" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" fill="#c59b27" letter-spacing="6" text-anchor="middle">
    INTERNATIONAL QUALITY ASSURANCE STANDARDS
  </text>

  <line x1="320" y1="188" x2="580" y2="188" stroke="url(#goldBorder)" stroke-width="2"/>

  <!-- Presentation text -->
  <text x="450" y="222" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="13" font-style="italic" fill="#555" text-anchor="middle">
    This is to certify that the Quality Management System of
  </text>

  <!-- Company Name -->
  <text x="450" y="260" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="26" font-weight="bold" fill="#0f2b48" letter-spacing="2" text-anchor="middle">
    AL ATTAF ADVANCED CONTRACTING CO.
  </text>
  <text x="450" y="284" font-family="'Inter', sans-serif" font-size="12" fill="#666" text-anchor="middle">
    Kingdom of Saudi Arabia • Commercial Reg: 2050119842
  </text>

  <text x="450" y="322" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="13" font-style="italic" fill="#555" text-anchor="middle">
    has been audited and found to comply with the requirements of
  </text>

  <!-- Standard Box -->
  <g transform="translate(230, 340)">
    <rect width="440" height="66" rx="8" fill="url(#blueAccent)" filter="url(#shadow)"/>
    <rect x="3" y="3" width="434" height="60" rx="6" fill="none" stroke="url(#goldBorder)" stroke-width="1.5"/>
    <text x="220" y="36" font-family="'Cinzel', 'Georgia', serif" font-size="24" font-weight="bold" fill="#ffffff" letter-spacing="3" text-anchor="middle">
      ISO 9001:2015
    </text>
    <text x="220" y="54" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#f3e5ab" letter-spacing="2" text-anchor="middle">
      QUALITY MANAGEMENT SYSTEM
    </text>
  </g>

  <!-- Scope description -->
  <text x="450" y="435" font-family="'Inter', sans-serif" font-size="11.5" fill="#444" text-anchor="middle">
    Scope: Industrial contracting, mechanical erection, civil construction, HVAC solutions,
  </text>
  <text x="450" y="453" font-family="'Inter', sans-serif" font-size="11.5" fill="#444" text-anchor="middle">
    instrumentation, and comprehensive plant maintenance across the Kingdom of Saudi Arabia.
  </text>

  <!-- Gold Seal -->
  <g transform="translate(140, 500)" filter="url(#shadow)">
    <!-- Ribbons -->
    <path d="M-12 18 L-22 65 L0 52 L22 65 L12 18 Z" fill="#996515"/>
    <path d="M-8 18 L-16 60 L0 48 L16 60 L8 18 Z" fill="#c59b27"/>
    <!-- Seal Circle -->
    <circle cx="0" cy="0" r="42" fill="url(#goldSeal)"/>
    <circle cx="0" cy="0" r="37" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="33" fill="none" stroke="#7a4f09" stroke-width="1"/>
    <text x="0" y="-8" font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold" fill="#3a2500" text-anchor="middle" letter-spacing="1">CERTIFIED</text>
    <text x="0" y="8" font-family="'Cinzel', serif" font-size="15" font-weight="bold" fill="#2b1a00" text-anchor="middle">QMS</text>
    <text x="0" y="21" font-family="'Inter', sans-serif" font-size="7.5" font-weight="bold" fill="#3a2500" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Certificate Details Left-Center -->
  <g transform="translate(250, 495)" font-family="'Inter', sans-serif" font-size="10.5" fill="#555">
    <text x="0" y="0"><tspan font-weight="bold" fill="#0f2b48">Certificate No:</tspan> QMS-SA-9001-2024</text>
    <text x="0" y="18"><tspan font-weight="bold" fill="#0f2b48">Initial Issue:</tspan> 14 January 2020</text>
    <text x="0" y="36"><tspan font-weight="bold" fill="#0f2b48">Valid Until:</tspan> 13 January 2027</text>
  </g>

  <!-- Signatures / Stamps Right -->
  <g transform="translate(720, 510)" text-anchor="middle">
    <!-- Signature line -->
    <path d="M-90 -12 Q-50 -35 -20 -15 T40 -30 T80 -10" fill="none" stroke="#0f2b48" stroke-width="2"/>
    <line x1="-90" y1="5" x2="90" y2="5" stroke="#999" stroke-width="1"/>
    <text x="0" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#0f2b48">Authorized Registrar</text>
    <text x="0" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#777">Global Certification Body</text>
  </g>

  <!-- Footer Security Tagline -->
  <text x="450" y="588" font-family="'Inter', sans-serif" font-size="9" fill="#999" text-anchor="middle" letter-spacing="1">
    AUTHENTIC DOCUMENT • VERIFIED BY ACCREDITATION COUNCIL • AL ATTAF INDUSTRIAL SERVICES
  </text>
</svg>
